name: Bug
description: Signaler un comportement incorrect
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Décrivez le problème sans publier de secret ni de donnée personnelle."
  - type: input
    id: version
    attributes:
      label: Version ou commit
      placeholder: "0.1.0 ou SHA"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      description: Comment reproduire le problème de manière déterministe ?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Python, système, services et paramètres pertinents.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Vérifications
      options:
        - label: Aucun secret n'est inclus dans cette issue
          required: true

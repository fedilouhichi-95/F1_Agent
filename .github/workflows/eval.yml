name: Eval (quality gate RAGAS)

# Portail de qualité : bloquant pour toute PR vers main.
# Prerequis : ajouter les secrets du repo (GROQ_API_KEY, MLFLOW_*).
# Tant que le jeu de référence est vide, seul le test structurel tourne.

on:
  pull_request:
    branches: [main]

jobs:
  evaluate:
    name: Évaluation RAGAS + exactitude chiffrée
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Évaluation (pytest -m eval)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python -m pytest -m eval